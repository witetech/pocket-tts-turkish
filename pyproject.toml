[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocket-tts-turkish"
version = "0.1.0"
description = "Turkish text-to-speech on Pocket TTS, with the text preparation the model needs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Wite Tech" }]
keywords = ["text-to-speech", "tts", "turkish", "pocket-tts", "voice-cloning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Natural Language :: Turkish",
]
# pocket-tts 3.1.0 and 3.3.0 give bit-identical audio with this model; later releases are untested.
dependencies = [
    "pocket-tts>=3.1,<3.4",
    "huggingface-hub>=0.23",
    "numpy>=2",
    "pyyaml>=6",
    "scipy>=1.5",
    "sentencepiece>=0.2.1",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pocket-tts-turkish = "pocket_tts_turkish.cli:main"

[project.urls]
Homepage = "https://github.com/witetech/pocket-tts-turkish"
Model = "https://huggingface.co/wite-tech/pocket-tts-turkish-6l"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_tts_turkish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
